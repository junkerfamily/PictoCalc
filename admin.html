<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PictoCalc Admin</title>
<link rel="icon" type="image/png" href="images/hamburger.png">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #111827;
    --ok: #166534;
    --ok-bg: #dcfce7;
    --err: #991b1b;
    --err-bg: #fee2e2;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  header .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }
  .menu-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .menu-tabs .tab {
    background: #f3f4f6;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .menu-tabs .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .row {
    display: grid;
    grid-template-columns: 72px 1fr 110px auto;
    gap: 12px;
    align-items: start;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .thumb-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
  }
  .thumb {
    width: 72px;
    height: 72px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #f9fafb;
    object-fit: cover;
    display: block;
  }
  .thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 4px;
  }
  .file-btn {
    position: relative;
    overflow: hidden;
    display: inline-block;
    text-align: center;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 8px;
    background: #f3f4f6;
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
  }
  .file-btn input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .row .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  label.field-label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
  }
  input[type="number"] {
    font-variant-numeric: tabular-nums;
  }
  input[type="text"]:focus,
  input[type="number"]:focus {
    outline: 2px solid #11182733;
    border-color: #111827;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary {
    background: #111827;
    color: #fff;
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #f3f4f6;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-danger {
    background: #fee2e2;
    color: var(--danger);
    border: 1px solid #fecaca;
    padding: 8px 10px;
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 12px;
    flex-wrap: wrap;
    margin: 12px 0 4px;
  }
  .menu-rename {
    display: flex;
    align-items: end;
    gap: 8px;
    flex: 1;
    min-width: 220px;
  }
  .menu-rename .field-label {
    flex: 1;
  }
  .status {
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .status.ok {
    display: block;
    background: var(--ok-bg);
    color: var(--ok);
  }
  .status.err {
    display: block;
    background: var(--err-bg);
    color: var(--err);
  }
  .empty {
    color: var(--muted);
    padding: 24px 8px;
    text-align: center;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  @media (max-width: 640px) {
    .row {
      grid-template-columns: 72px 1fr;
    }
    .row .price-col,
    .row .remove-col {
      grid-column: 2;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>Admin · Menu</h1>
    <div class="actions">
      <a href="/" style="text-decoration:none">
        <button type="button" class="btn-secondary">← Calculator</button>
      </a>
      <button type="button" class="btn-primary" id="saveBtn">Save changes</button>
    </div>
  </header>

  <main>
    <p class="hint">Edit menus and items. Rename a menu tab with the label field below. Large images are resized automatically (max 1200px). Save, then refresh the calculator.</p>
    <div id="status" class="status"></div>
    <div class="menu-tabs" id="menuTabs"></div>
    <div class="toolbar">
      <div class="menu-rename">
        <label class="field-label">
          Menu label
          <input type="text" id="menuLabelInput" autocomplete="off" placeholder="e.g. Lunch">
        </label>
        <button type="button" class="btn-secondary" id="renameMenuBtn">Rename</button>
      </div>
      <button type="button" class="btn-secondary" id="addBtn">+ Add item</button>
    </div>
    <div id="itemList"></div>
  </main>

<script>
  let configData = null;
  let currentMenu = "";
  let dirty = false;

  const statusEl = document.getElementById("status");
  const saveBtn = document.getElementById("saveBtn");
  const addBtn = document.getElementById("addBtn");
  const menuLabelInput = document.getElementById("menuLabelInput");
  const renameMenuBtn = document.getElementById("renameMenuBtn");

  async function init() {
    try {
      const res = await fetch(`/api/config?ts=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      configData = await res.json();
      const menus = Object.keys(configData.menus || {});
      currentMenu = (configData.defaultMenu && menus.includes(configData.defaultMenu))
        ? configData.defaultMenu
        : (menus[0] || "");
      renderTabs();
      renderItems();
      syncMenuLabelInput();
      setDirty(false);
      clearStatus();
    } catch (err) {
      console.error(err);
      showStatus("Failed to load config. Make sure the Node server is running (npm start).", "err");
    }
  }

  function syncMenuLabelInput() {
    menuLabelInput.value = currentMenu || "";
  }

  function renderTabs() {
    const container = document.getElementById("menuTabs");
    container.innerHTML = "";
    Object.keys(configData.menus || {}).forEach((name) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab" + (name === currentMenu ? " active" : "");
      btn.textContent = name;
      btn.onclick = () => {
        flushItemsFromDom();
        currentMenu = name;
        renderTabs();
        renderItems();
        syncMenuLabelInput();
      };
      container.appendChild(btn);
    });
  }

  function renameCurrentMenu() {
    if (!configData || !currentMenu) return;
    flushItemsFromDom();
    const oldName = currentMenu;
    const newName = String(menuLabelInput.value || "").trim();
    if (!newName) {
      showStatus("Menu label cannot be empty.", "err");
      syncMenuLabelInput();
      return;
    }
    if (newName === oldName) {
      clearStatus();
      return;
    }
    const existing = Object.keys(configData.menus || {});
    if (existing.includes(newName)) {
      showStatus(`A menu named “${newName}” already exists.`, "err");
      syncMenuLabelInput();
      return;
    }

    const menus = {};
    for (const [name, items] of Object.entries(configData.menus)) {
      menus[name === oldName ? newName : name] = items;
    }
    configData.menus = menus;
    if (configData.defaultMenu === oldName) configData.defaultMenu = newName;
    currentMenu = newName;
    setDirty(true);
    renderTabs();
    renderItems();
    syncMenuLabelInput();
    showStatus(`Renamed “${oldName}” to “${newName}”. Click Save changes.`, "ok");
  }

  function renderItems() {
    const list = document.getElementById("itemList");
    list.innerHTML = "";
    const items = (configData.menus && configData.menus[currentMenu]) || [];
    if (!items.length) {
      list.innerHTML = '<div class="empty">No items in this menu. Click “Add item” to create one.</div>';
      return;
    }
    items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="thumb-wrap">
          <div class="thumb-slot"></div>
          <label class="file-btn">Image<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-index="${index}"></label>
        </div>
        <div>
          <label class="field-label">
            Name
            <input type="text" data-field="name" data-index="${index}" autocomplete="off">
          </label>
          <div class="meta"></div>
        </div>
        <label class="field-label price-col">
          Price ($)
          <input type="number" min="0" step="0.01" inputmode="decimal" data-field="price" data-index="${index}">
        </label>
        <div class="remove-col">
          <button type="button" class="btn-danger" data-remove="${index}">Remove</button>
        </div>
      `;

      const thumbSlot = row.querySelector(".thumb-slot");
      if (item.image) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.alt = "";
        img.src = `${item.image}?ts=${Date.now()}`;
        thumbSlot.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "thumb placeholder";
        placeholder.textContent = "No image";
        thumbSlot.appendChild(placeholder);
      }

      const meta = [];
      if (item.image) meta.push(item.image.replace(/^images\//, ""));
      row.querySelector(".meta").textContent = meta.join(" · ");

      const nameInput = row.querySelector('input[data-field="name"]');
      const priceInput = row.querySelector('input[data-field="price"]');
      nameInput.value = item.name;
      priceInput.value = Number(item.price).toFixed(2);
      nameInput.addEventListener("input", () => setDirty(true));
      priceInput.addEventListener("input", () => setDirty(true));

      row.querySelector('input[type="file"]').addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) uploadImageForItem(index, file);
      });

      row.querySelector("[data-remove]").addEventListener("click", () => removeItem(index));
      list.appendChild(row);
    });
  }

  function flushItemsFromDom() {
    if (!configData || !currentMenu) return;
    const items = configData.menus[currentMenu] || [];
    document.querySelectorAll("#itemList input[data-field]").forEach((input) => {
      const index = Number(input.dataset.index);
      if (!items[index]) return;
      if (input.dataset.field === "name") {
        items[index].name = input.value;
      } else if (input.dataset.field === "price") {
        const value = parseFloat(input.value);
        items[index].price = Number.isFinite(value) ? value : items[index].price;
      }
    });
  }

  function uniqueNewName(items) {
    const names = new Set(items.map((i) => String(i.name || "").trim()));
    let n = 1;
    let candidate = "New item";
    while (names.has(candidate)) {
      n += 1;
      candidate = `New item ${n}`;
    }
    return candidate;
  }

  function addItem() {
    if (!configData || !currentMenu) return;
    flushItemsFromDom();
    const items = configData.menus[currentMenu] || (configData.menus[currentMenu] = []);
    items.push({
      name: uniqueNewName(items),
      price: 0,
      scale: 8,
    });
    setDirty(true);
    clearStatus();
    renderItems();
    const inputs = document.querySelectorAll('#itemList input[data-field="name"]');
    const last = inputs[inputs.length - 1];
    if (last) {
      last.focus();
      last.select();
    }
  }

  function removeItem(index) {
    flushItemsFromDom();
    const items = configData.menus[currentMenu] || [];
    const item = items[index];
    if (!item) return;
    const label = String(item.name || "").trim() || "this item";
    if (!confirm(`Remove “${label}” from ${currentMenu}?`)) return;
    items.splice(index, 1);
    setDirty(true);
    clearStatus();
    renderItems();
  }

  async function uploadImageForItem(index, file) {
    flushItemsFromDom();
    const items = configData.menus[currentMenu] || [];
    if (!items[index]) return;
    showStatus(`Uploading “${file.name}”…`, "ok");
    try {
      const body = new FormData();
      body.append("image", file);
      const res = await fetch("/api/upload", {
        method: "POST",
        credentials: "include",
        body,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      items[index].image = data.path;
      setDirty(true);
      renderItems();
      const note = data.resized
        ? `Image saved and resized from ${data.originalWidth}×${data.originalHeight} to ${data.width}×${data.height}. Click Save changes.`
        : `Image saved (${data.width}×${data.height}). Click Save changes.`;
      showStatus(note, "ok");
    } catch (err) {
      console.error(err);
      showStatus(err.message || "Image upload failed", "err");
      renderItems();
    }
  }

  function validateBeforeSave() {
    flushItemsFromDom();
    const menuNames = Object.keys(configData.menus || {});
    const seenMenus = new Set();
    for (const menuName of menuNames) {
      const trimmed = String(menuName || "").trim();
      if (!trimmed) return "Every menu needs a non-empty label.";
      if (seenMenus.has(trimmed)) return `Duplicate menu label "${trimmed}".`;
      seenMenus.add(trimmed);
    }
    for (const [menuName, items] of Object.entries(configData.menus || {})) {
      const seen = new Set();
      for (const item of items) {
        const name = String(item.name || "").trim();
        if (!name) return `Every item in ${menuName} needs a name.`;
        if (seen.has(name)) return `Duplicate name "${name}" in ${menuName}.`;
        seen.add(name);
      }
    }
    return null;
  }

  function setDirty(value) {
    dirty = value;
    saveBtn.disabled = !dirty;
    saveBtn.textContent = dirty ? "Save changes" : "Saved";
  }

  function showStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = "status " + kind;
  }

  function clearStatus() {
    statusEl.textContent = "";
    statusEl.className = "status";
  }

  addBtn.addEventListener("click", addItem);
  renameMenuBtn.addEventListener("click", renameCurrentMenu);
  menuLabelInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      renameCurrentMenu();
    }
  });

  saveBtn.addEventListener("click", async () => {
    const validationError = validateBeforeSave();
    if (validationError) {
      setDirty(true);
      showStatus(validationError, "err");
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      const res = await fetch("/api/config", {
        method: "PUT",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(configData),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const fresh = await fetch(`/api/config?ts=${Date.now()}`, { cache: "no-store" });
      configData = await fresh.json();
      const menus = Object.keys(configData.menus || {});
      if (!menus.includes(currentMenu)) {
        currentMenu = (configData.defaultMenu && menus.includes(configData.defaultMenu))
          ? configData.defaultMenu
          : (menus[0] || "");
      }
      renderTabs();
      renderItems();
      syncMenuLabelInput();
      setDirty(false);
      showStatus("Saved. Refresh the calculator to see menu changes.", "ok");
    } catch (err) {
      console.error(err);
      setDirty(true);
      showStatus(err.message || "Save failed", "err");
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  init();
</script>
</body>
</html>
